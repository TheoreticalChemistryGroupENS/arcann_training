name: Documentation Deployment
on:
  push:
    branches:
      - main
      - develop  # TEMPORARY: deploy docs from develop
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.x
          enable-cache: true
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-
      - run: uv sync --locked --group docs
      - name: Build docs (PR check only)
        if: github.event_name == 'pull_request'
        run: uv run mkdocs build --clean --verbose
      - name: Deploy docs
        if: github.event_name != 'pull_request'
        run: uv run mkdocs gh-deploy --force --clean --verbose